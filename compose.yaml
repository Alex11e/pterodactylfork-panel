name: alex-panel
services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: panel
      MARIADB_USER: panel
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  panel:
    working_dir: /app
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: alex-panel:local
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_NAME: Alex Panel
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:?Set a persistent APP_KEY in deploy/.env}
      APP_URL: ${APP_URL:?Set APP_URL in deploy/.env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Budapest}
      APP_LOCALE: hu
      APP_FALLBACK_LOCALE: en
      APP_ENVIRONMENT_ONLY: 'true'
      PANEL_BACKEND: docker
      CLOUDFLARE_TUNNEL_HOSTNAME: ${CLOUDFLARE_TUNNEL_HOSTNAME:-}
      TRUSTED_PROXIES: '*'
      WINGS_BROWSER_MODE: proxy
      SUBDOMAINS_ENABLED: ${SUBDOMAINS_ENABLED:-false}
      SUBDOMAINS_DOMAIN: ${SUBDOMAINS_DOMAIN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_DNS_TOKEN: ${CLOUDFLARE_DNS_TOKEN:-}
      DB_HOST: database
      DB_PORT: '3306'
      DB_DATABASE: panel
      DB_USERNAME: panel
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      HASHIDS_SALT: ${HASHIDS_SALT:?Set HASHIDS_SALT in deploy/.env}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
      MAIL_FROM_NAME: Alex Panel
    ports:
      - '${PANEL_BIND_IP:-127.0.0.1}:${PANEL_PORT:-8080}:80'
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - storage:/app/storage
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, '8', http://127.0.0.1/auth/login]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
volumes:
  database:
  redis:
  storage:
