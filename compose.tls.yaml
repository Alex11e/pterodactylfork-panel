services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      panel:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?Set PANEL_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
